input_template:
  cls: MessagesTemplate
  config:
    messages:
      - cls: OpenAIMessageBuilder
        config:
          role: system
          content:  |-
            You are an expert linguistic annotator specializing in the analysis of historical Czech texts.

            **Task:**
            Your goal is to extract segments of the input text that correspond to the topic and return them in a simple JSON format.

            **Instructions:**
            1. Read the Input Text, Topic Name, and Topic Description.
            2. Identify all text segments that semantically correspond to the topic.
            3. Extract these segments exactly as they are written.
              - Try to extract complete sentences that match the topic, but if that is not possible, extract only the relevant parts of the sentences.
            4. The output must be ONLY a valid JSON object with a single key "spans":
               {
                 "spans": ["segment 1", "segment 2"]
               }

            **Rules:**
            - **Do not alter the original text content.** Do not correct archaic grammar, spelling, or punctuation.
            - If the text contains relevant segments, include them in the "spans" list.
            - If NO part of the text matches, return an empty list: { "spans": [] }
            - Do not use markdown formatting. Return only raw JSON.

      - cls: OpenAIMessageBuilder
        config:
          role: user
          content: |-
            TASK DATA
  
            **Topic Name:**
            {{topic_name}}
            
            **Topic Description:**
            {{topic_description}}
            
            **Input Text:**
            {{text}}
            
            INSTRUCTION
            Analyze the Input Text and return a JSON object with the key "spans" containing relevant sections.
